name: backend-ci

# Go backend suite (build + vet + race tests against a real PostgreSQL).
#
# Runs on every push and pull request, but the heavy `test` job is GATED on a
# cheap path detector: on a change that doesn't touch backend/** it is skipped.
# We deliberately do NOT path-filter the `on:` trigger — a workflow filtered out
# by `on.paths` never produces its check, which leaves a *required* status check
# stuck "pending" and blocks the PR forever. A job skipped via `if:` instead
# reports "skipped", which branch protection counts as success. So a backend-ci
# required check stays green on a frontend-only PR without running Go at all.
on:
  push:
  pull_request:

# A newer push to the same ref cancels an in-flight run for it.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed files via the API on pull_request.
  pull-requests: read

jobs:
  # Cheap (~seconds) detector. Its output gates the expensive job below.
  changes:
    name: detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  test:
    name: build + vet + test (race)
    needs: changes
    # Skipped (→ counts as a passing required check) when no backend file changed.
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mioru
          POSTGRES_PASSWORD: mioru
          POSTGRES_DB: mioru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mioru -d mioru_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    env:
      # Matches the local throwaway test DB contract; the store harness skips
      # DB tests when this is unset, so CI must set it to actually run them.
      TEST_DATABASE_URL: postgres://mioru:mioru@localhost:5432/mioru_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go version — read from go.mod.
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race -count=1
