<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- KAN-26: black glyph on light browser UI, inverted to white on dark UI -->
  <style>
    @media (prefers-color-scheme: dark) { image { filter: invert(1); } }
  </style>
  <image width="256" height="256" href="data:image/png;base64,"/>
</svg>
